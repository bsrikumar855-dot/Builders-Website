<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1e19" />
      <stop offset="100%" stop-color="#1F4B43" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#g)" />
  <circle cx="400" cy="220" r="100" fill="#3D9970" opacity="0.05" />
  <!-- Command Center / Monitoring Station -->
  <g stroke="#3D9970" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Main screen grid -->
    <rect x="300" y="140" width="200" height="130" rx="8" fill="rgba(255,255,255,0.03)" />
    <!-- Center screen crosshairs / scan reticle -->
    <circle cx="400" cy="205" r="30" stroke-width="2" />
    <path d="M 400 165 V 245 M 360 205 H 440" stroke-width="1.5" stroke-dasharray="4 4" />
    <!-- Stand -->
    <path d="M 380 270 L 360 295 H 440 L 420 270" />
    <!-- Camera targets -->
    <rect x="315" y="155" width="20" height="15" rx="2" stroke-width="2" opacity="0.6" />
    <rect x="465" y="155" width="20" height="15" rx="2" stroke-width="2" opacity="0.6" />
    <rect x="315" y="240" width="20" height="15" rx="2" stroke-width="2" opacity="0.6" />
    <rect x="465" y="240" width="20" height="15" rx="2" stroke-width="2" opacity="0.6" />
  </g>
  <text x="400" y="380" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">24/7 Remote CCTV Monitoring</text>
  <text x="400" y="420" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Sabari Command Center · Coimbatore</text>
</svg>
