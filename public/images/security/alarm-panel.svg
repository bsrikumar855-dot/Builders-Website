<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1e19" />
      <stop offset="100%" stop-color="#1F4B43" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#g)" />
  <circle cx="400" cy="220" r="100" fill="#3D9970" opacity="0.05" />
  <!-- Alarm Control Panel -->
  <g stroke="#3D9970" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Panel Body -->
    <rect x="330" y="140" width="140" height="160" rx="8" fill="rgba(255,255,255,0.03)" />
    <!-- Screen -->
    <rect x="350" y="160" width="100" height="40" rx="4" stroke-width="3" />
    <!-- Keys -->
    <circle cx="370" cy="230" r="4" fill="#3D9970" />
    <circle cx="400" cy="230" r="4" fill="#3D9970" />
    <circle cx="430" cy="230" r="4" fill="#3D9970" />
    <circle cx="370" cy="255" r="4" fill="#3D9970" />
    <circle cx="400" cy="255" r="4" fill="#3D9970" />
    <circle cx="430" cy="255" r="4" fill="#3D9970" />
    <circle cx="370" cy="280" r="4" fill="#3D9970" />
    <circle cx="400" cy="280" r="4" fill="#3D9970" />
    <circle cx="430" cy="280" r="4" fill="#3D9970" />
    <!-- Status LEDs -->
    <circle cx="355" cy="180" r="3" fill="#22c55e" stroke="none" />
    <circle cx="445" cy="180" r="3" fill="#ef4444" stroke="none" />
  </g>
  <text x="400" y="380" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Alarm Systems &amp; Intrusion Detection</text>
  <text x="400" y="420" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Intrusion Prevention · Sabari Security Service</text>
</svg>
