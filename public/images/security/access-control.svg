<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1e19" />
      <stop offset="100%" stop-color="#1F4B43" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#g)" />
  <circle cx="400" cy="220" r="100" fill="#3D9970" opacity="0.05" />
  <!-- Biometric Fingerprint / Keyless Entry -->
  <g stroke="#3D9970" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Fingerprint ridges -->
    <path d="M 370 240 C 370 200, 430 200, 430 240" />
    <path d="M 360 250 C 360 180, 440 180, 440 250" />
    <path d="M 380 230 C 380 210, 420 210, 420 230 V 250" />
    <path d="M 390 250 V 225 C 390 220, 410 220, 410 225 V 250" />
    <!-- Scanner Frame -->
    <rect x="340" y="140" width="120" height="160" rx="10" stroke-width="3" fill="rgba(255,255,255,0.01)" />
    <!-- Laser line -->
    <line x1="330" y1="210" x2="470" y2="210" stroke="#ef4444" stroke-width="3" />
  </g>
  <text x="400" y="380" font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Access Control &amp; Biometrics</text>
  <text x="400" y="420" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">Keyless Authorization · Sabari Security Service</text>
</svg>
